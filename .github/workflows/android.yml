name: Android source validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  release-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/check-public-source.mjs
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - name: Focused release tests
        run: >-
          ./gradlew :app:testReleaseUnitTest
          --tests '*PlusFeatureContractTest' --tests '*BridgeProtocolTest'
          --tests '*Fe7CursorNavigatorTest' --tests '*InputMapperTest'
          --tests '*ShaderPresetTest' --tests '*LaunchIntentResolverTest'
          --tests '*ExternalRomPathTest' --tests '*RomArchiveTest'
          --tests '*LatestCompanionSnapshotTest' --tests '*CssRasterGridTest'
      - run: ./gradlew :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-plus-development-apk
          path: app/build/outputs/apk/release/*unsigned.apk
