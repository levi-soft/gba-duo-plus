name: Android source validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  release-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0 # The boundary checker compares against the pinned upstream commit.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/check-public-source.mjs
      - name: Verify upstream extension boundary
        run: |
          node --test tools/upstream-boundary.test.mjs
          node tools/upstream-boundary.mjs check
      - uses: android-actions/setup-android@v3
        with:
          # The legacy SDK package "tools" is no longer available.
          packages: platform-tools
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - name: Native sandbox and graphics checks
        run: app/src/test/native/run.sh
      - name: Focused release tests
        run: >-
          ./gradlew :app:testReleaseUnitTest
          --tests '*PlusFeatureContractTest' --tests '*BridgeProtocolTest'
          --tests '*FeMapCursorNavigatorTest' --tests '*CompanionInputTest' --tests '*InputMapperTest'
          --tests '*ShaderPresetTest' --tests '*LaunchIntentResolverTest'
          --tests '*ExternalRomPathTest' --tests '*RomArchiveTest'
          --tests '*LatestCompanionSnapshotTest' --tests '*RetainedScriptSnapshotTest' --tests '*CssRasterGridTest'
          --tests '*ResponsiveCssTest' --tests '*GameTitleTest'
          --tests '*SaveSyncTest' --tests '*GameStorageTest'
          --tests '*PackFingerprintTest' --tests '*PackManifestTest'
          --tests '*RetroAchievementsActivityTest'
          --tests '*AchievementPopupsTest' --tests '*CompanionTreeTest'
          --tests '*AutomaticBuilderCoreTest' --tests '*BuilderRomSourceTest'
          --tests '*InstalledPackStorageTest'
          --tests '*BuilderLanguageTest' --tests '*Artwork*Test'
      - run: ./gradlew :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-plus-development-apk
          path: app/build/outputs/apk/release/*unsigned.apk
      - name: Single Screen layout, input and startup tests
        run: >-
          ./gradlew -PsingleScreen=true :app:testDebugUnitTest
          --tests '*SingleScreen*Test' --tests '*TouchButtonsTest'
          --tests '*StartupTasksTest' --tests '*InputMapperTest' --tests '*CoreSessionTest'
          --tests '*PlusFeatureContractTest'
      - name: Build separate Single Screen APK
        run: ./gradlew -PsingleScreen=true :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-plus-ss-development-apk
          path: app/build/outputs/apk/release/*unsigned.apk
